<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f8fafc;

            color: #1e293b;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background: linear-gradient(
                135deg,
                #7A1220,
                #A6192E
            );

            color: white;

            padding: 25px 40px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }


        header h1 {

            margin: 0;

            font-size: 28px;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 900px;

            margin: 40px auto;

            padding: 0 20px;

        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;

        }


        .back-button {

            background: #64748b;

            color: white;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 8px;

            font-weight: bold;

        }


        .back-button:hover {

            background: #475569;

        }


        /* =========================
           CHAT BOX
        ========================= */

        .chat-card {

            background: white;

            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            overflow: hidden;

        }


        .chat-header {

            background: #7A1220;

            color: white;

            padding: 18px 20px;

        }


        .chat-header h2 {

            margin: 0;

            font-size: 20px;

        }


        .chat-header p {

            margin: 5px 0 0;

            opacity: 0.9;

        }


        /* =========================
           MESSAGES
        ========================= */

        .messages {

            min-height: 350px;

            padding: 25px;

            background: #f8fafc;

        }


        .bot-message {

            background: #fee2e2;

            color: #7f1d1d;

            padding: 14px 18px;

            border-radius: 12px;

            max-width: 75%;

            margin-bottom: 15px;

        }


        .user-message {

            background: #7A1220;

            color: white;

            padding: 14px 18px;

            border-radius: 12px;

            max-width: 75%;

            margin-left: auto;

            margin-bottom: 15px;

        }


        /* =========================
           INPUT
        ========================= */

        .chat-input {

            display: flex;

            gap: 10px;

            padding: 18px;

            border-top: 1px solid #e5e7eb;

            background: white;

        }


        .chat-input input {

            flex: 1;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

        }


        .chat-input input:focus {

            outline: none;

            border-color: #A6192E;

        }


        .chat-input button {

            padding: 12px 20px;

            background: #A6192E;

            color: white;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

        }


        .chat-input button:hover {

            background: #7A1220;

        }


        /* =========================
           QUICK QUESTIONS
        ========================= */

        .quick-questions {

            padding: 20px;

            background: white;

            border-top: 1px solid #e5e7eb;

        }


        .quick-questions h3 {

            margin-top: 0;

            color: #7A1220;

        }


        .quick-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .quick-buttons button {

            padding: 9px 14px;

            border: 1px solid #fecaca;

            background: #fff1f2;

            color: #7A1220;

            border-radius: 20px;

            cursor: pointer;

        }


        .quick-buttons button:hover {

            background: #fee2e2;

        }


        @media (max-width: 600px) {

            .chat-input {

                flex-direction: column;

            }

            .chat-input button {

                width: 100%;

            }

            .bot-message,
            .user-message {

                max-width: 90%;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        AI Chatbot
    </h1>

</header>


<div class="container">


    <div class="navigation">

        <a href="{% url 'home' %}"
           class="back-button">

            ← Back to Home

        </a>

    </div>


    <div class="chat-card">


        <div class="chat-header">

            <h2>
                Faculty Science Assistant
            </h2>

            <p>
                Ask me about the booking system.
            </p>

        </div>


        <div class="messages"
             id="messages">


            <div class="bot-message">

                👋 Hello!

                <br><br>

                I am the Faculty Science Booking Assistant.

                <br><br>

                You can ask me about:

                <br>
                • Room booking
                <br>
                • Device booking
                <br>
                • My bookings
                <br>
                • Booking status

            </div>


        </div>


        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="sendMessage()">

                Send

            </button>

        </div>


        <div class="quick-questions">

            <h3>
                Quick Questions
            </h3>


            <div class="quick-buttons">

                <button onclick="quickQuestion(
                    'How can I book a room?'
                )">

                    How can I book a room?

                </button>


                <button onclick="quickQuestion(
                    'How can I book a device?'
                )">

                    How can I book a device?

                </button>


                <button onclick="quickQuestion(
                    'Where can I see my bookings?'
                )">

                    Where can I see my bookings?

                </button>


                <button onclick="quickQuestion(
                    'What does pending mean?'
                )">

                    What does Pending mean?

                </button>

            </div>

        </div>


    </div>


</div>


<script>

function addMessage(message, type) {

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        type === "user"
            ? "user-message"
            : "bot-message";

    div.innerHTML = message;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


function getCookie(name) {

    let cookieValue = null;

    if (document.cookie &&
        document.cookie !== '') {

        const cookies =
            document.cookie.split(';');

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (cookie.startsWith(name + '=')) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }

    return cookieValue;
}


function sendMessage() {

    const input =
        document.getElementById("userInput");

    const question =
        input.value.trim();

    if (!question) {
        return;
    }


    // Show user's message
    addMessage(
        question,
        "user"
    );

    input.value = "";


    // Send question to Django
    fetch("/chatbot/api/", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/x-www-form-urlencoded",

            "X-CSRFToken":
                getCookie("csrftoken")
        },

        body:
            new URLSearchParams({
                message: question
            })
    })

    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Server error"
            );
        }

        return response.json();

    })

    .then(data => {

        addMessage(
            data.reply,
            "bot"
        );

    })

    .catch(error => {

        console.error(
            "Chatbot Error:",
            error
        );

        addMessage(
            "Sorry, I cannot connect to the chatbot server.",
            "bot"
        );

    });
}


function quickQuestion(question) {

    document.getElementById(
        "userInput"
    ).value = question;

    sendMessage();
}


function handleEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}

</script>
