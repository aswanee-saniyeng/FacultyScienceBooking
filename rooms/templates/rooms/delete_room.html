<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Room - Faculty Science Booking System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1f2937;
        }

        header {
            background: linear-gradient(
                135deg,
                #7A1220,
                #A6192E
            );

            color: white;
            padding: 20px 50px;
        }

        header h1 {
            margin: 0;
            color: white;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 650px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 35px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 0 0 15px;
            color: #7A1220;
        }

        .message {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .room-info {
            background: #fef2f2;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .room-info strong {
            color: #7A1220;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .delete-btn {
            background: #A6192E;
            color: white;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .delete-btn:hover {
            background: #A6192E;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

    </style>

</head>

<body>

<header>

    <h1>Faculty Science Booking System</h1>

    <p>Admin Management - Rooms</p>

</header>


<div class="container">

    <div class="card">

        <div class="icon">
            ⚠️
        </div>

        <h2>Delete Room?</h2>

        <p class="message">
            Are you sure you want to delete this room?
            This action cannot be undone.
        </p>


        <div class="room-info">

            <p>
                <strong>Room:</strong>
                {{ room.room_name }}
            </p>

            <p>
                <strong>Building:</strong>
                {{ room.building }}
            </p>

            <p>
                <strong>Capacity:</strong>
                {{ room.capacity }}
            </p>

        </div>


        <div class="buttons">

            <form method="POST"
                  style="display: inline;">

                {% csrf_token %}

                <button type="submit"
                        class="btn delete-btn">
                    Yes, Delete
                </button>

            </form>


            <a href="{% url 'manage_rooms' %}"
               class="btn cancel-btn">
                Cancel
            </a>

        </div>

    </div>

</div>

</body>

</html>
