<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Device</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #991b1b, #dc2626);
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            color: #991b1b;
            margin-top: 0;
        }

        .warning {
            color: #475569;
            margin: 20px 0;
            line-height: 1.6;
        }

        .device-name {
            font-weight: bold;
            color: #1e293b;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 7px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

    </style>

</head>

<body>

    <header>
        <h1>Faculty Science Booking System</h1>
    </header>

    <div class="container">

        <div class="card">

            <h2>Delete Device</h2>

            <p class="warning">
                Are you sure you want to delete
                <span class="device-name">
                    {{ device.device_name }}
                </span>?
            </p>

            <p class="warning">
                This action cannot be undone.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="buttons">

                    <button type="submit" class="delete-btn">
                        Yes, Delete
                    </button>

                    <a href="{% url 'manage_devices' %}"
                       class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
