<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Faculty Science Booking System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(135deg, #991b1b, #dc2626);
            color: white;
            padding: 20px 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 54px;
            height: 54px;
            background: white;
            color: #b91c1c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .header-text h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-text p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* ================= MAIN ================= */

        .main {
            min-height: calc(100vh - 94px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: #fee2e2;
            z-index: 0;
        }

        .circle-one {
            width: 280px;
            height: 280px;
            top: -100px;
            left: -100px;
        }

        .circle-two {
            width: 220px;
            height: 220px;
            bottom: -90px;
            right: -70px;
        }

        /* ================= LOGIN CARD ================= */

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
            position: relative;
            z-index: 1;
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #fef2f2;
            color: #b91c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #991b1b;
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 10px 0 30px;
            font-size: 15px;
        }

        /* ================= FORM ================= */

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1f2937;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: linear-gradient(135deg, #b91c1c, #dc2626);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 12px rgba(185, 28, 28, 0.20);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 16px rgba(185, 28, 28, 0.28);
        }

        /* ================= ERROR ================= */

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* ================= REGISTER ================= */

        .register {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #64748b;
            font-size: 14px;
        }

        .register a {
            color: #b91c1c;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .header {
                padding: 18px 20px;
            }

            .header-content {
                justify-content: center;
            }

            .header-text h1 {
                font-size: 20px;
            }

            .header-text p {
                font-size: 12px;
            }

            .main {
                padding: 30px 15px;
            }

            .container {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="header-content">

        <div class="logo">
            FS
        </div>

        <div class="header-text">

            <h1>
                Faculty Science Booking
            </h1>

            <p>
                Faculty of Science and Technology
            </p>

        </div>

    </div>

</header>


<!-- MAIN -->

<main class="main">

    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>


    <!-- LOGIN CARD -->

    <div class="container">

        <div class="login-icon">
            FS
        </div>

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Login to access the Faculty Science Booking System
        </p>


        {% if form.errors %}

            <div class="error">
                Username or password is incorrect.
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </div>

    </div>

</main>

</body>
</html>
